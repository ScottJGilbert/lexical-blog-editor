# Publishes every public package in packages/* when a release is created.
# Pre-releases are published under the `beta` dist-tag.
name: Publish packages

on:
  release:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: npm install -g pnpm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # `-r` publishes each workspace package whose version isn't on npm yet.
      - run: pnpm -r --filter "./packages/*" publish --provenance --no-git-checks --access public ${{ github.event.release.prerelease && '--tag beta' || '' }}
